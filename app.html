<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SnapJad — مساعدك بالشغل</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SnapJad">
<meta name="theme-color" content="#0E4C56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F6F2; --card:#FFFFFF; --ink:#17252A; --muted:#5F6F6C;
    --primary:#0E4C56; --primary-soft:#E1EEEC;
    --accent:#E8552F; --accent-soft:#FDE9E2;
    --danger:#C4483C; --danger-soft:#F9E9E7;
    --ok:#2E7D5B; --ok-soft:#E4F2EB;
    --line:#E6E4DC; --radius:14px;
    --shadow:0 1px 3px rgba(14,76,86,.07),0 4px 14px rgba(14,76,86,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
  .logo{font-weight:900;font-size:22px}
  .logo small{font-weight:400;font-size:12px;opacity:.75;display:block;line-height:1;margin-top:2px}
  nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
  nav button{background:transparent;border:none;color:#fff;opacity:.75;font-family:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s}
  nav button:hover{opacity:1;background:rgba(255,255,255,.12)}
  nav button.active{opacity:1;background:rgba(255,255,255,.18)}
  .who{font-size:13px;opacity:.85;padding:0 6px}
  main{max-width:980px;margin:0 auto;padding:22px 16px 90px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  h2{font-size:20px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:var(--primary-soft);color:var(--primary)}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  #login-btn{background:#1FA24A}
  .btn.gold{background:var(--accent);color:#fff}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--muted)}
  input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#FCFCFB;color:var(--ink);transition:border-color .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  textarea{min-height:110px;resize:vertical;line-height:1.8}
  .grid{display:grid;gap:12px;margin-bottom:12px}
  .grid.c2{grid-template-columns:1fr 1fr}
  .grid.c3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:640px){.grid.c2,.grid.c3{grid-template-columns:1fr}}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
  .badge.type{background:var(--primary-soft);color:var(--primary)}
  .badge.late{background:var(--danger-soft);color:var(--danger)}
  .badge.today{background:var(--accent-soft);color:#B4431F}
  .badge.done{background:var(--ok-soft);color:var(--ok)}
  .badge.up{background:#EEF1F0;color:var(--muted)}
  .task{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
  .task .body{flex:1;min-width:0}
  .task .title{font-weight:700;font-size:15px}
  .task.done .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .task .notes{font-size:13px;color:var(--muted);margin-top:3px}
  .group-title{font-size:15px;font-weight:800;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .group-title .count{background:var(--line);border-radius:99px;padding:0 9px;font-size:12px}
  .meeting-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .meeting-row:hover{background:#FAFBFA}
  .meeting-row:last-child{border-bottom:none}
  .meeting-row .info{flex:1}
  .meeting-row .title{font-weight:700}
  .meeting-row .details{font-size:12.5px;color:var(--muted)}
  .m-stat{font-size:12px;color:var(--muted);text-align:center;min-width:52px}
  .m-stat b{display:block;font-size:17px;color:var(--ink)}
  .hero{background:linear-gradient(135deg,#0A3A42 0%,#166273 100%);color:#fff;border-radius:var(--radius);padding:22px;margin-bottom:16px}
  .hero .date{font-size:13px;opacity:.8}
  .hero h1{font-size:24px;font-weight:900;margin:2px 0 6px}
  .hero .summary{font-size:14px;opacity:.92}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .chip{background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:.12s}
  .chip.off{background:#F0F1EF;color:var(--muted)}
  .chip:hover{border-color:var(--primary)}
  .chip.add{background:transparent;border:1.5px dashed var(--primary);color:var(--primary)}
  .back{background:none;border:none;color:var(--primary);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:10px}
  .smart{border:2px solid var(--accent);background:linear-gradient(180deg,#FFF8F5,#fff)}
  .smart h2::before{content:"✨ "}
  .preview-item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#FCFCFB}
  .thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{from{opacity:.3}to{opacity:1}}
  .btn.rec{background:var(--danger);color:#fff}
  .btn.rec.on{animation:recpulse 1.2s infinite}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(196,72,60,.45)}50%{box-shadow:0 0 0 10px rgba(196,72,60,0)}}
  .rec-status{font-size:13px;color:var(--muted)}
  .rec-status.live{color:var(--danger);font-weight:700}

  /* ===== الرئيسية بعد الدخول ===== */
  @keyframes hubIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:760px){.hub-grid{grid-template-columns:1fr}}
  .hub-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:26px 22px;cursor:pointer;border:1.5px solid transparent;text-align:right;
    transition:transform .2s,box-shadow .2s,border-color .2s;
    animation:hubIn .5s ease both;
  }
  .hub-card:nth-child(2){animation-delay:.08s}
  .hub-card:nth-child(3){animation-delay:.16s}
  .hub-card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 14px 30px rgba(14,76,86,.14)}
  .hub-card .ico{font-size:34px;margin-bottom:14px;display:inline-block;transition:transform .25s}
  .hub-card:hover .ico{transform:scale(1.12) rotate(-4deg)}
  .hub-card h3{font-size:17px;font-weight:800;margin-bottom:6px;color:var(--primary)}
  .hub-card p{color:var(--muted);font-size:13.5px;line-height:1.7}
  footer{position:fixed;bottom:0;right:0;left:0;text-align:center;padding:8px;font-size:11.5px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}

  /* ===== الإحصائيات ===== */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
  .stat-tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;text-align:center}
  .stat-tile b{display:block;font-size:28px;font-weight:900;color:var(--primary)}
  .stat-tile span{font-size:12.5px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
  .bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bars .bar{width:100%;background:var(--primary);border-radius:6px 6px 0 0;min-height:3px;transition:height .4s ease}
  .bars .bar-label{font-size:11px;color:var(--muted);margin-top:6px}
  .toplist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .toplist-row:last-child{border-bottom:none}
  .toplist-row b{color:var(--primary)}

  /* ===== جدول المعلمين ===== */
  .data-table{width:100%;border-collapse:collapse;font-size:14px}
  .data-table th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--line)}
  .data-table td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .data-table tr:last-child td{border-bottom:none}
  .data-table .yn{cursor:pointer;font-size:18px;user-select:none}
  .data-table input[type=text]{border:none;background:transparent;padding:2px;font-size:13px;color:var(--muted);width:100%}
  .data-table input[type=text]:focus{background:var(--bg);border-radius:6px}
  .data-table th .th-sub{font-weight:500;opacity:.8}
  .t-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .t-summary .badge{font-size:13px;padding:4px 12px}

  /* ===== أسئلة للمدير ===== */
  .q-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-inline-start:5px solid var(--line)}
  .q-card.yes{border-inline-start-color:var(--ok)}
  .q-card.no{border-inline-start-color:var(--danger)}
  .q-head{display:flex;gap:10px;align-items:flex-start}
  .q-num{background:var(--primary-soft);color:var(--primary);border-radius:99px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
  .q-text{font-weight:700;font-size:16px;line-height:1.7;flex:1}
  .q-hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
  .q-actions{display:flex;gap:10px;margin-top:12px}
  .q-btn{flex:1;padding:13px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:.12s;color:var(--ink)}
  .q-btn:hover{border-color:var(--primary)}
  .q-btn.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .q-btn.no.on{background:var(--danger);border-color:var(--danger);color:#fff}
  .q-notes{margin-top:10px}
  .q-tools{display:flex;gap:8px;margin-top:10px}

  /* ===== شاشة تسجيل الدخول ===== */
  @keyframes loginAurora1{0%,100%{transform:translate(-8%,-6%) scale(1)}50%{transform:translate(8%,10%) scale(1.2)}}
  @keyframes loginAurora2{0%,100%{transform:translate(6%,4%) scale(1.05)}50%{transform:translate(-10%,-10%) scale(1)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes logoShimmer{0%{background-position:200% center}100%{background-position:-200% center}}
  @keyframes errShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;
    background:linear-gradient(165deg,#0A3A42 0%,#0E4C56 55%,#166273 100%);
  }
  .login-wrap .laurora{position:absolute;inset:-15%;pointer-events:none;filter:blur(60px);opacity:.6}
  .login-wrap .laurora i{position:absolute;border-radius:50%}
  .login-wrap .laurora i:nth-child(1){width:38%;height:38%;left:8%;top:5%;background:radial-gradient(circle,rgba(232,85,47,.4),transparent 70%);animation:loginAurora1 14s ease-in-out infinite}
  .login-wrap .laurora i:nth-child(2){width:34%;height:34%;right:5%;bottom:8%;background:radial-gradient(circle,rgba(255,181,158,.28),transparent 70%);animation:loginAurora2 17s ease-in-out infinite}
  .login-wrap .laurora i:nth-child(3){width:26%;height:26%;right:20%;top:15%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);animation:loginAurora1 11s ease-in-out infinite reverse}
  .login-card{
    background:rgba(255,255,255,.97);border-radius:22px;padding:38px 32px;width:100%;max-width:380px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);position:relative;z-index:1;
    animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .login-card .logo2{
    text-align:center;font-size:30px;font-weight:900;margin-bottom:4px;
    background:linear-gradient(90deg,var(--primary) 30%,var(--accent) 50%,var(--primary) 70%);
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:logoShimmer 6s linear infinite;
  }
  .login-card .tag2{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px}
  .login-card label{margin-top:12px}
  .login-card input{transition:border-color .15s,box-shadow .15s}
  .login-card input:focus{box-shadow:0 0 0 4px var(--primary-soft)}
  .login-card .btn{width:100%;margin-top:18px;padding:12px;font-size:15px;transition:transform .15s,filter .15s}
  .login-card .btn:active{transform:scale(.98)}
  .login-err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:14px;display:none}
  .login-err.show{display:block;animation:errShake .4s ease}
  .login-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="login-screen" class="login-wrap">
  <div class="laurora"><i></i><i></i><i></i></div>
  <div class="login-card">
    <div class="logo2">Snap<span>Jad</span></div>
    <div class="tag2">سجّل دخولك بحساب الفريق</div>
    <label>الإيميل</label>
    <input id="login-email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')doLogin()">
    <label>كلمة السر</label>
    <input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" id="login-btn" onclick="doLogin()">تسجيل الدخول</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">حساباتكم مضافة مسبقاً — إذا ما معك بيانات دخولك اطلبها من مسؤول الفريق</div>
  </div>
</div>

<!-- ===== التطبيق (يظهر بعد الدخول) ===== -->
<div id="app-shell" style="display:none">
  <header>
    <a href="index.html" style="text-decoration:none;color:inherit"><div class="logo">SnapJad<small>مساعدك بالشغل</small></div></a>
    <nav>
      <button id="nav-hub" class="active" onclick="go('hub')">🏠 الرئيسية</button>
      <button id="nav-dash" onclick="go('dash')">📋 لوحة اليوم</button>
      <button id="nav-meet" onclick="go('meet')">🗓️ الاجتماعات</button>
      <button id="nav-daily" onclick="go('daily')">⚡ مهامي اليومية</button>
      <button id="nav-projects" onclick="go('projects')">🚀 المشاريع</button>
      <button id="nav-stats" onclick="go('stats')" style="display:none">📊 إحصائيات</button>
      <span class="who" id="who-label"></span>
      <button onclick="doLogout()">🚪 خروج</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer>snapjad.com — متصل بقاعدة بيانات حقيقية 🔐</footer>
</div>

<script>
/* ============================================================
   ٠) الاتصال بـ Supabase
   ============================================================ */
const SUPABASE_URL = "https://brirttlxldoozcqqtttg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_31tK2sbLbGZXNdLgM8jbJg_HfGV3MpL";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
});

const TASK_TYPES = ["متابعة","تنفيذ"];

let me = null;          // {id, full_name} — المستخدم الحالي
let teamProfiles = [];  // كل أسماء الفريق [{id, full_name}]
let meetings = [];      // اجتماعاتي (كل وحدة فيها attendees[] و tasks[])
let dailyTasks = [];    // مهام سريعة مش تابعة لأي اجتماع
let projects = [];      // مشاريع (كل وحدة فيها items[] أكشن بوينتس وأفكار)
let view = "hub";
let openMeetingId = null;
let openProjectId = null;
let previewTasks = null;
let previewSummary = "";
let projectPreviewItems = null;
let editingItemId = null;
let editingQuestionId = null;
const requestedView = new URLSearchParams(location.search).get("view");

/* ============================================================
   ١) تسجيل الدخول والخروج
   ============================================================ */
async function doLogin(){
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  const btn = document.getElementById("login-btn");
  err.classList.remove("show");
  if(!email || !pass){ err.textContent = "عبّي الإيميل وكلمة السر"; err.classList.add("show"); return; }

  btn.disabled = true; btn.textContent = "عم أتحقق...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = "تسجيل الدخول";

  if(error){
    err.textContent = "الإيميل أو كلمة السر غلط — تأكد منهم أو تواصل مع مسؤول الفريق";
    err.classList.add("show");
    return;
  }
  await afterLogin();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

async function afterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return; }

  /* نجيب ملفي الشخصي */
  const { data: myProfile } = await sb.from("profiles").select("id, full_name, is_admin").eq("id", user.id).single();
  me = myProfile || { id: user.id, full_name: user.email };

  /* نجيب أسماء كل الفريق (للقوائم المنسدلة) */
  const { data: profiles } = await sb.from("profiles").select("id, full_name").order("full_name");
  teamProfiles = profiles || [];

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").style.display = "block";
  document.getElementById("who-label").textContent = "👋 " + (me.full_name || "");
  if(me.is_admin) document.getElementById("nav-stats").style.display = "";

  await loadMeetings();
  if(["dash","meet","daily","stats","projects"].includes(requestedView)) await go(requestedView);
  else render();
}

/* أول ما تفتح الصفحة: هل في جلسة دخول محفوظة أصلاً؟ */
async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
}

/* ============================================================
   ٢) تحميل البيانات من قاعدة البيانات
   ============================================================ */
async function loadMeetings(){
  const { data, error } = await sb
    .from("meetings")
    .select("*, meeting_attendees(id, attendee_name), tasks(*)")
    .order("meeting_date", { ascending: false });
  if(error){ console.error(error); meetings = []; return; }
  meetings = (data || []).map(m => ({
    id: m.id,
    title: m.title,
    location: m.location,
    date: m.meeting_date,
    preparedBy: m.prepared_by,
    summary: m.summary,
    attendees: (m.meeting_attendees || []).map(a => a.attendee_name),
    tasks: (m.tasks || []).map(t => ({
      id: t.id,
      type: t.task_type,

}

async function loadDailyTasks(){

    .from("daily_tasks").select("*").order("due_date", { ascending: true, nullsFirst: false });

  }));

/* ============================================================
   ٣) أدوات مساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0,10);
const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function dayName(dateStr){ if(!dateStr) return ""; return DAYS[new Date(dateStr+"T12:00:00").getDay()]; }
const EN_DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const EN_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(dateStr){
  if(!dateStr) return "بدون موعد";
  const d = new Date(dateStr+"T12:00:00");
  return EN_DAYS[d.getDay()]+" "+d.getDate()+" "+EN_MONTHS[d.getMonth()];
}
function taskStatus(t){
  if(t.done) return "done";
  if(!t.due) return "up";
  if(t.due < todayStr()) return "late";
  if(t.due === todayStr()) return "today";
  return "up";
}
const STATUS_LABEL = {late:"متأخرة", today:"اليوم", up:"قادمة", done:"منجزة"};
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function allTasks(){
  const out = [];
  meetings.forEach(m => m.tasks.forEach(t => out.push({...t, meetingId:m.id, meetingTitle:m.title})));
  return out;
}

/* ============================================================
   ٤) التنقل
   ============================================================ */
async function go(v, id){
  if(recording) stopRec();
  view = v;
  openMeetingId = (v==="detail")? (id ?? null) : null;
  openProjectId = (v==="project"||v==="pquestions")? (id ?? null) : null;
  previewTasks = null; projectPreviewItems = null; editingItemId = null; editingQuestionId = null;
  document.getElementById("nav-hub").classList.toggle("active", v==="hub");
  document.getElementById("nav-dash").classList.toggle("active", v==="dash");
  document.getElementById("nav-meet").classList.toggle("active", v==="meet"||v==="detail");
  document.getElementById("nav-daily").classList.toggle("active", v==="daily");
  document.getElementById("nav-projects").classList.toggle("active", v==="projects"||v==="project"||v==="pquestions");
  document.getElementById("nav-stats").classList.toggle("active", v==="stats");
  if(v==="daily") await loadDailyTasks();
  if(v==="stats") await loadStats();
  if(v==="projects"||v==="project"||v==="pquestions") await loadProjects();
  render();
  window.scrollTo(0,0);
}

/* ============================================================
   ٥) لوحة اليوم
   ============================================================ */
function renderDash(){
  const tasks = allTasks();
  const groups = {late:[], today:[], up:[], done:[]};
  tasks.forEach(t => groups[taskStatus(t)].push(t));
  groups.late.sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  groups.up.sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));

  const open = tasks.filter(t=>!t.done).length;
  let summary;
  if(tasks.length===0) summary = "ما في مهام لسا — بلش بإضافة أول اجتماع";
  else if(open===0) summary = "كل المهام منجزة، يعطيك العافية! ✨";
  else summary = `عندك ${open} مهمة مفتوحة` + (groups.late.length? ` — منها ${groups.late.length} متأخرة ⚠️` : "");

  let html = `<div class="hero"><div class="date">${fmtDate(todayStr())}</div><h1>أهلاً ${esc((me?.full_name||"").split(" ")[0]||"")} 👋</h1><div class="summary">${summary}</div></div>`;

  if(tasks.length===0){
    html += `<div class="card"><div class="empty"><div class="big">🗂️</div>لوحة اليوم بتجمعلك كل المهام من كل الاجتماعات بمكان واحد.<br><button class="btn" style="margin-top:14px" onclick="go('meet')">أضف أول اجتماع</button></div></div>`;
  }else{
    html += `<div class="card">`;
    [["late","🔴"],["today","🟡"],["up","🟢"],["done","✅"]].forEach(([key,icon])=>{
      if(groups[key].length===0) return;
      html += `<div class="group-title">${icon} ${STATUS_LABEL[key]} <span class="count">${groups[key].length}</span></div>`;
      groups[key].forEach(t => html += taskRow(t, true));
    });
    html += `</div>`;
  }
  return html;
}

function taskRow(t, showMeeting){
  const st = taskStatus(t);
  const canToggle = t.ownerId===me?.id || meetings.find(m=>m.id===(t.meetingId||openMeetingId))?._mine !== false;
  return `
  <div class="task ${t.done?"done":""}">
    <input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}', this.checked)">
    <div class="body">
      <div class="title">${esc(t.desc)}</div>
      <div class="meta">
        <span class="badge type">${esc(t.type)}</span>
        <span>👤 ${esc(t.owner)}</span>
        <span class="badge ${st}">📅 ${fmtDate(t.due)}</span>
        ${showMeeting? `<span>· ${esc(t.meetingTitle)}</span>`:""}
      </div>
      ${t.notes? `<div class="notes">📝 ${esc(t.notes)}</div>`:""}
    </div>
    <button class="btn danger small" onclick="deleteTask(this,'${t.id}')">حذف</button>
  </div>`;
}

/* ---------- 🎙️ التسجيل الصوتي (تسجيل حقيقي + رفع + تفريغ عبر Munsit) ---------- */
let mediaRecorder = null, mediaStream = null, recording = false, audioChunks = [];
async function toggleRec(){
  const status = document.getElementById("rec-status");
  if(recording){ stopRec(); return; }
  if(!navigator.mediaDevices?.getUserMedia){ status.textContent = "⚠️ متصفحك ما بيدعم تسجيل الصوت — جرب كروم"; return; }

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){ status.textContent = "⚠️ ما قدرت أوصل للمايكروفون"; return; }

  audioChunks = [];
  const preferredTypes = ["audio/mp4", "audio/aac", "audio/webm;codecs=opus", "audio/webm"];
  const supportedType = preferredTypes.find(t => window.MediaRecorder?.isTypeSupported?.(t));
  mediaRecorder = supportedType ? new MediaRecorder(mediaStream, { mimeType: supportedType }) : new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStopped;
  mediaRecorder.start();
  recording = true;

  const btn = document.getElementById("rec-btn");
  btn.textContent = "⏹️ وقّف التسجيل"; btn.classList.add("on");
  status.textContent = "🔴 عم أسجل... احكوا طبيعي"; status.classList.add("live");
}

function stopRec(){
  recording = false;
  try{ mediaRecorder?.stop(); }catch(e){}
  try{ mediaStream?.getTracks().forEach(t=>t.stop()); }catch(e){}
  const btn = document.getElementById("rec-btn");
  if(btn){ btn.textContent = "🎙️ سجّل الاجتماع"; btn.classList.remove("on"); }
}

async function onRecordingStopped(){
  const status = document.getElementById("rec-status");
  status.classList.remove("live");
  status.textContent = "⏳ عم أرفع وأفرّغ الصوت...";

  const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
  const ext = (blob.type.split("/")[1] || "webm").split(";")[0];
  const path = `${openMeetingId}/${Date.now()}.${ext}`;

  const { error: uploadError } = await sb.storage.from("recordings").upload(path, blob, { contentType: blob.type });
  if(uploadError){ status.textContent = "⚠️ صار خطأ برفع الصوت: " + uploadError.message; return; }
  await sb.from("meetings").update({ recording_url: path }).eq("id", openMeetingId);

  const form = new FormData();
  form.append("file", blob, `recording.${ext}`);
  const { data, error } = await sb.functions.invoke("transcribe-meeting", { body: form });

  if(error || !data?.transcript){
    let detail = error?.message || "";
    try{ const body = await error?.context?.json(); if(body?.detail || body?.error) detail = (body.error||"") + " " + (body.detail||""); }catch(e){}
    status.textContent = "⚠️ صار خطأ بالتفريغ: " + detail; return;
  }

  const box = document.getElementById("smart-text");
  const prev = box.value.trim();
  box.value = (prev ? prev + "\n" : "") + data.transcript;
  status.textContent = "✔️ خلص التفريغ — راجع النص ثم اكبس فصّلها مهام";
}

async function quickAddTask(){

let quickMediaRecorder = null, quickMediaStream = null, quickRecording = false, quickAudioChunks = [];
async function toggleQuickRec(){
  const status = document.getElementById("quick-rec-status");
  if(quickRecording){ stopQuickRec(); return; }
  if(!navigator.mediaDevices?.getUserMedia){ status.textContent = "⚠️ متصفحك ما بيدعم تسجيل الصوت"; return; }

  try{ quickMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ status.textContent = "⚠️ ما قدرت أوصل للمايكروفون"; return; }

  quickAudioChunks = [];
  const preferredTypes = ["audio/mp4", "audio/aac", "audio/webm;codecs=opus", "audio/webm"];
  const supportedType = preferredTypes.find(t => window.MediaRecorder?.isTypeSupported?.(t));
  quickMediaRecorder = supportedType ? new MediaRecorder(quickMediaStream, { mimeType: supportedType }) : new MediaRecorder(quickMediaStream);
  quickMediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) quickAudioChunks.push(e.data); };
  quickMediaRecorder.onstop = onQuickRecordingStopped;
  quickMediaRecorder.start();
  quickRecording = true;

  const btn = document.getElementById("quick-rec-btn");
  btn.classList.add("on"); btn.textContent = "⏹️";
  status.textContent = "🔴 عم أسجل..."; status.classList.add("live");
}

function stopQuickRec(){
  quickRecording = false;
  try{ quickMediaRecorder?.stop(); }catch(e){}
  try{ quickMediaStream?.getTracks().forEach(t=>t.stop()); }catch(e){}
  const btn = document.getElementById("quick-rec-btn");
  if(btn){ btn.classList.remove("on"); btn.textContent = "🎙️"; }
}

async function onQuickRecordingStopped(){
  const status = document.getElementById("quick-rec-status");
  if(!status) return;
  status.classList.remove("live");
  status.textContent = "⏳ عم أفرّغ وأحلل الصوت...";

  const blob = new Blob(quickAudioChunks, { type: quickMediaRecorder.mimeType || "audio/webm" });
  const ext = (blob.type.split("/")[1] || "webm").split(";")[0];
  const path = `daily/${me.id}/${Date.now()}.${ext}`;
  await sb.storage.from("recordings").upload(path, blob, { contentType: blob.type });

  const form = new FormData();
  form.append("file", blob, `recording.${ext}`);
  const { data: transcribed, error: transcribeErr } = await sb.functions.invoke("transcribe-meeting", { body: form });
  if(transcribeErr || !transcribed?.transcript){ status.textContent = "⚠️ صار خطأ بالتفريغ — جرب مرة ثانية"; return; }

  const { data: parsed, error: parseErr } = await sb.functions.invoke("smart-parse", {
    body: { text: transcribed.transcript, teamNames: [], todayStr: todayStr(), dayNameStr: dayName(todayStr()) }
  });
  if(parseErr || !Array.isArray(parsed?.tasks) || parsed.tasks.length===0){
    status.textContent = "⚠️ ما قدرت أفهم مهمة واضحة — جرب تحكي أوضح"; return;
  }

  const rows = parsed.tasks.map(t=>({
    description: t.desc || "مهمة",
    due_date: t.due || todayStr(),
    notes: t.notes || "",
    is_done: false
  }));
  const { error: insertErr } = await sb.from("daily_tasks").insert(rows);
  if(insertErr){ status.textContent = "⚠️ صار خطأ بالإضافة: " + insertErr.message; return; }

  status.textContent = `✔️ ضفت ${rows.length} مهمة`;
  await loadDailyTasks();
  render();
}

async function toggleDailyTask(taskId, isDone){
  const { error } = await sb.from("daily_tasks").update({ is_done: isDone }).eq("id", taskId);
  if(error){ alert("صار خطأ: " + error.message); }
  await loadDailyTasks();
  render();
}
async function deleteDailyTask(btn, taskId){
  if(btn.dataset.armed !== "1"){
    btn.dataset.armed = "1"; btn.textContent = "متأكد؟";
    setTimeout(()=>{ btn.dataset.armed = "0"; btn.textContent = "حذف"; }, 2500);
    return;
  }
  await sb.from("daily_tasks").delete().eq("id", taskId);
  await loadDailyTasks();
  render();
}

let pageStats = null;
async function loadStats(){
  const since = new Date(Date.now() - 30*24*60*60*1000).toISOString();
  const { data, error } = await sb.from("page_views").select("path, referrer, created_at").gte("created_at", since).order("created_at", { ascending: false });
  if(error){ console.error(error); pageStats = { error: error.message }; return; }

  const rows = data || [];
  const today = todayStr();
  const byDay = {};
  const byPath = {};
  const byRef = {};
  rows.forEach(r=>{
    const day = r.created_at.slice(0,10);
    byDay[day] = (byDay[day]||0) + 1;
    byPath[r.path] = (byPath[r.path]||0) + 1;
    const ref = r.referrer ? (()=>{ try{ return new URL(r.referrer).hostname; }catch(e){ return r.referrer; } })() : "مباشر";
    byRef[ref] = (byRef[ref]||0) + 1;
  });

  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now() - i*24*60*60*1000).toISOString().slice(0,10);
    last7.push({ day: d, count: byDay[d]||0 });
  }

  pageStats = {
    total30d: rows.length,
    today: byDay[today]||0,
    last7,
    topPaths: Object.entries(byPath).sort((a,b)=>b[1]-a[1]).slice(0,6),
    topRefs: Object.entries(byRef).sort((a,b)=>b[1]-a[1]).slice(0,5),
  };
}

async function loadProjects(){

  if(error){ console.error(error); projects = []; return; }
  projects = (data || []).map(p => ({
    id: p.id, name: p.name, description: p.description, createdBy: p.created_by,
    items: (p.project_items || []).map(it => ({
      id: it.id, kind: it.kind, desc: it.description, owner: it.owner_name, ownerId: it.owner_id,
      due: it.due_date, notes: it.notes, done: it.is_done
    })),
    teachers: (p.project_teachers || [])
      .sort((a,b)=> String(a.created_at).localeCompare(String(b.created_at)))
      .map(t => ({
        id: t.id, name: t.teacher_name, subject: t.subject, approach: t.approach || "same_as_a",

        hasReviewSessions: t.has_review_sessions ?? null, hasReel: !!t.has_reel, notes: t.notes

    questions: (p.project_questions || [])
      .sort((a,b)=> (a.position - b.position) || String(a.created_at).localeCompare(String(b.created_at)))
      .map(q => ({ id: q.id, text: q.question, hint: q.hint, answer: q.answer, notes: q.notes }))
  }));
}

function renderProjectQuestions(){
  const p = projects.find(x=>x.id===openProjectId);
  if(!p) return renderProjectsList();
  if(!canEditProject(p)) return renderProjectDetail();
  const qs = p.questions;
  const yes = qs.filter(q=>q.answer==="yes").length;
  const no = qs.filter(q=>q.answer==="no").length;
  const open = qs.length - yes - no;

  let html = `
  <button class="back" onclick="go('project','${p.id}')">→ رجوع لمشروع ${esc(p.name)}</button>
  <div class="card">
    <h2>📋 أسئلة للمدير — ${esc(p.name)}</h2>
    <div class="sub">اضغط «نعم» أو «لا» وقت الاجتماع، واكتب ملاحظة إذا لزم. الإجابات بتنحفظ لحالها. (خاصة فيك إنت بس)</div>
    <div class="stat-grid" style="margin:12px 0 0">
      <div class="stat-tile"><b>${yes}</b><span>✅ نعم</span></div>
      <div class="stat-tile"><b>${no}</b><span>❌ لا</span></div>
      <div class="stat-tile"><b>${open}</b><span>⏳ بدون جواب</span></div>
      <div class="stat-tile"><b>${qs.length}</b><span>مجموع الأسئلة</span></div>
    </div>
    <div class="q-tools"><button class="btn ghost small" onclick="copyQuestionsSummary(this)">📋 نسخ الملخص</button></div>
  </div>`;

  if(qs.length===0) html += `<div class="card"><div class="empty">ما في أسئلة لسا — ضيف من تحت</div></div>`;
  qs.forEach((q,i)=>{ html += questionCard(q, i+1); });

    <h2>سؤال جديد</h2>
    <div style="display:flex;gap:8px"><input id="new-question-input" placeholder="اكتب السؤال..." style="flex:1" onkeydown="if(event.key==='Enter')addQuestion()"><button class="btn small" onclick="addQuestion()">إضافة</button></div>

/* ---------- 🎙️ تسجيل صوتي لصفحة المشروع ---------- */
let projMediaRecorder = null, projMediaStream = null, projRecording = false, projAudioChunks = [];
async function toggleProjRec(){
  const status = document.getElementById("proj-rec-status");
  if(projRecording){ stopProjRec(); return; }
  if(!navigator.mediaDevices?.getUserMedia){ status.textContent = "⚠️ متصفحك ما بيدعم تسجيل الصوت"; return; }

  try{ projMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ status.textContent = "⚠️ ما قدرت أوصل للمايكروفون"; return; }

  projAudioChunks = [];
  const preferredTypes = ["audio/mp4", "audio/aac", "audio/webm;codecs=opus", "audio/webm"];
  const supportedType = preferredTypes.find(t => window.MediaRecorder?.isTypeSupported?.(t));
  projMediaRecorder = supportedType ? new MediaRecorder(projMediaStream, { mimeType: supportedType }) : new MediaRecorder(projMediaStream);
  projMediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) projAudioChunks.push(e.data); };
  projMediaRecorder.onstop = onProjRecordingStopped;
  projMediaRecorder.start();
  projRecording = true;

  const btn = document.getElementById("proj-rec-btn");
  btn.textContent = "⏹️ وقّف التسجيل"; btn.classList.add("on");
  status.textContent = "🔴 عم أسجل... احكوا طبيعي"; status.classList.add("live");
}

function stopProjRec(){
  projRecording = false;
  try{ projMediaRecorder?.stop(); }catch(e){}
  try{ projMediaStream?.getTracks().forEach(t=>t.stop()); }catch(e){}
  const btn = document.getElementById("proj-rec-btn");
  if(btn){ btn.textContent = "🎙️ سجّل"; btn.classList.remove("on"); }
}

async function onProjRecordingStopped(){
  const status = document.getElementById("proj-rec-status");
  if(!status) return;
  status.classList.remove("live");
  status.textContent = "⏳ عم أرفع وأفرّغ الصوت...";

  const blob = new Blob(projAudioChunks, { type: projMediaRecorder.mimeType || "audio/webm" });
  const ext = (blob.type.split("/")[1] || "webm").split(";")[0];
  const path = `project/${openProjectId}/${Date.now()}.${ext}`;
  await sb.storage.from("recordings").upload(path, blob, { contentType: blob.type });

  const form = new FormData();
  form.append("file", blob, `recording.${ext}`);
  const { data, error } = await sb.functions.invoke("transcribe-meeting", { body: form });

  if(error || !data?.transcript){
    status.textContent = "⚠️ صار خطأ بالتفريغ — جرب مرة ثانية"; return;
  }

  const box = document.getElementById("proj-smart-text");
  const prev = box.value.trim();
  box.value = (prev ? prev + "\n" : "") + data.transcript;
  status.textContent = "✔️ خلص التفريغ — راجع النص ثم اكبس فصّلها أكشن بوينتس";
}

/* تسجيل زيارة الصفحة (بدون تسجيل دخول، بدون أي بيانات شخصية) */
fetch(SUPABASE_URL + "/rest/v1/page_views", {
  method: "POST",
  headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
  body: JSON.stringify({ path: location.pathname, referrer: document.referrer || null })
}).catch(()=>{});

checkSession();
</script>
