<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapJad — مساعدك بالشغل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F6F2; --card:#FFFFFF; --ink:#17252A; --muted:#5F6F6C;
    --primary:#0E4C56; --primary-soft:#E1EEEC;
    --accent:#E8552F; --accent-soft:#FDE9E2;
    --danger:#C4483C; --danger-soft:#F9E9E7;
    --ok:#2E7D5B; --ok-soft:#E4F2EB;
    --line:#E6E4DC; --radius:14px;
    --shadow:0 1px 3px rgba(14,76,86,.07),0 4px 14px rgba(14,76,86,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}
  header{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
  .logo{font-weight:900;font-size:22px}
  .logo small{font-weight:400;font-size:12px;opacity:.75;display:block;line-height:1;margin-top:2px}
  nav{display:flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap;align-items:center}
  nav button{background:transparent;border:none;color:#fff;opacity:.75;font-family:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s}
  nav button:hover{opacity:1;background:rgba(255,255,255,.12)}
  nav button.active{opacity:1;background:rgba(255,255,255,.18)}
  .who{font-size:13px;opacity:.85;padding:0 6px}
  main{max-width:980px;margin:0 auto;padding:22px 16px 90px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  h2{font-size:20px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:var(--primary-soft);color:var(--primary)}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger{background:var(--danger-soft);color:var(--danger)}
  .btn.gold{background:var(--accent);color:#fff}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--muted)}
  input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:#FCFCFB;color:var(--ink);transition:border-color .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
  textarea{min-height:110px;resize:vertical;line-height:1.8}
  .grid{display:grid;gap:12px;margin-bottom:12px}
  .grid.c2{grid-template-columns:1fr 1fr}
  .grid.c3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:640px){.grid.c2,.grid.c3{grid-template-columns:1fr}}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
  .badge.type{background:var(--primary-soft);color:var(--primary)}
  .badge.late{background:var(--danger-soft);color:var(--danger)}
  .badge.today{background:var(--accent-soft);color:#B4431F}
  .badge.done{background:var(--ok-soft);color:var(--ok)}
  .badge.up{background:#EEF1F0;color:var(--muted)}
  .task{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
  .task .body{flex:1;min-width:0}
  .task .title{font-weight:700;font-size:15px}
  .task.done .title{text-decoration:line-through;color:var(--muted)}
  .task .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
  .task .notes{font-size:13px;color:var(--muted);margin-top:3px}
  .group-title{font-size:15px;font-weight:800;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
  .group-title .count{background:var(--line);border-radius:99px;padding:0 9px;font-size:12px}
  .meeting-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  .meeting-row:hover{background:#FAFBFA}
  .meeting-row:last-child{border-bottom:none}
  .meeting-row .info{flex:1}
  .meeting-row .title{font-weight:700}
  .meeting-row .details{font-size:12.5px;color:var(--muted)}
  .m-stat{font-size:12px;color:var(--muted);text-align:center;min-width:52px}
  .m-stat b{display:block;font-size:17px;color:var(--ink)}
  .hero{background:linear-gradient(135deg,#0A3A42 0%,#166273 100%);color:#fff;border-radius:var(--radius);padding:22px;margin-bottom:16px}
  .hero .date{font-size:13px;opacity:.8}
  .hero h1{font-size:24px;font-weight:900;margin:2px 0 6px}
  .hero .summary{font-size:14px;opacity:.92}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
  .chip{background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:.12s}
  .chip.off{background:#F0F1EF;color:var(--muted)}
  .chip:hover{border-color:var(--primary)}
  .chip.add{background:transparent;border:1.5px dashed var(--primary);color:var(--primary)}
  .back{background:none;border:none;color:var(--primary);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:10px}
  .smart{border:2px solid var(--accent);background:linear-gradient(180deg,#FFF8F5,#fff)}
  .smart h2::before{content:"✨ "}
  .preview-item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#FCFCFB}
  .thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:10px 0}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{from{opacity:.3}to{opacity:1}}
  .btn.rec{background:var(--danger);color:#fff}
  .btn.rec.on{animation:recpulse 1.2s infinite}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(196,72,60,.45)}50%{box-shadow:0 0 0 10px rgba(196,72,60,0)}}
  .rec-status{font-size:13px;color:var(--muted)}
  .rec-status.live{color:var(--danger);font-weight:700}
  footer{position:fixed;bottom:0;right:0;left:0;text-align:center;padding:8px;font-size:11.5px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}

  /* ===== شاشة تسجيل الدخول ===== */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(165deg,#0A3A42 0%,#0E4C56 55%,#166273 100%)}
  .login-card{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .login-card .logo2{text-align:center;font-size:28px;font-weight:900;color:var(--primary);margin-bottom:4px}
  .login-card .logo2 span{color:var(--accent)}
  .login-card .tag2{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px}
  .login-card label{margin-top:12px}
  .login-card .btn{width:100%;margin-top:18px;padding:12px;font-size:15px}
  .login-err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:14px;display:none}
  .login-err.show{display:block}
  .login-hint{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="logo2">Snap<span>Jad</span></div>
    <div class="tag2">سجّل دخولك بحساب الفريق</div>
    <label>الإيميل</label>
    <input id="login-email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')doLogin()">
    <label>كلمة السر</label>
    <input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" id="login-btn" onclick="doLogin()">تسجيل الدخول</button>
    <div class="login-err" id="login-err"></div>
    <div class="login-hint">حساباتكم مضافة مسبقاً — إذا ما معك بيانات دخولك اطلبها من مسؤول الفريق</div>
  </div>
</div>

<!-- ===== التطبيق (يظهر بعد الدخول) ===== -->
<div id="app-shell" style="display:none">
  <header>
    <a href="index.html" style="text-decoration:none;color:inherit"><div class="logo">SnapJad<small>مساعدك بالشغل</small></div></a>
    <nav>
      <button id="nav-dash" class="active" onclick="go('dash')">📋 لوحة اليوم</button>
      <button id="nav-meet" onclick="go('meet')">🗓️ الاجتماعات</button>
      <span class="who" id="who-label"></span>
      <button onclick="doLogout()">🚪 خروج</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer>snapjad.com — متصل بقاعدة بيانات حقيقية 🔐</footer>
</div>

<script>
/* ============================================================
   ٠) الاتصال بـ Supabase
   ============================================================ */
const SUPABASE_URL = "https://brirttlxldoozcqqtttg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_31tK2sbLbGZXNdLgM8jbJg_HfGV3MpL";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TASK_TYPES = ["متابعة","تنفيذ"];

let me = null;          // {id, full_name} — المستخدم الحالي
let teamProfiles = [];  // كل أسماء الفريق [{id, full_name}]
let meetings = [];      // اجتماعاتي (كل وحدة فيها attendees[] و tasks[])
let view = "dash";
let openMeetingId = null;
let previewTasks = null;

/* ============================================================
   ١) تسجيل الدخول والخروج
   ============================================================ */
async function doLogin(){
  const email = document.getElementById("login-email").value.trim();
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  const btn = document.getElementById("login-btn");
  err.classList.remove("show");
  if(!email || !pass){ err.textContent = "عبّي الإيميل وكلمة السر"; err.classList.add("show"); return; }

  btn.disabled = true; btn.textContent = "عم أتحقق...";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = "تسجيل الدخول";

  if(error){
    err.textContent = "الإيميل أو كلمة السر غلط — تأكد منهم أو تواصل مع مسؤول الفريق";
    err.classList.add("show");
    return;
  }
  await afterLogin();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

async function afterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ return; }

  /* نجيب ملفي الشخصي */
  const { data: myProfile } = await sb.from("profiles").select("id, full_name").eq("id", user.id).single();
  me = myProfile || { id: user.id, full_name: user.email };

  /* نجيب أسماء كل الفريق (للقوائم المنسدلة) */
  const { data: profiles } = await sb.from("profiles").select("id, full_name").order("full_name");
  teamProfiles = profiles || [];

  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-shell").style.display = "block";
  document.getElementById("who-label").textContent = "👋 " + (me.full_name || "");

  await loadMeetings();
  render();
}

/* أول ما تفتح الصفحة: هل في جلسة دخول محفوظة أصلاً؟ */
async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await afterLogin(); }
}

/* ============================================================
   ٢) تحميل البيانات من قاعدة البيانات
   ============================================================ */
async function loadMeetings(){
  const { data, error } = await sb
    .from("meetings")
    .select("*, meeting_attendees(id, attendee_name), tasks(*)")
    .order("meeting_date", { ascending: false });
  if(error){ console.error(error); meetings = []; return; }
  meetings = (data || []).map(m => ({
    id: m.id,
    title: m.title,
    location: m.location,
    date: m.meeting_date,
    preparedBy: m.prepared_by,
    attendees: (m.meeting_attendees || []).map(a => a.attendee_name),
    tasks: (m.tasks || []).map(t => ({
      id: t.id,
      type: t.task_type,
      desc: t.description,
      owner: t.owner_name,
      ownerId: t.owner_id,
      due: t.due_date,
      notes: t.notes,
      done: t.is_done
    }))
  }));
}

/* ============================================================
   ٣) أدوات مساعدة
   ============================================================ */
const todayStr = () => new Date().toISOString().slice(0,10);
const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function dayName(dateStr){ if(!dateStr) return ""; return DAYS[new Date(dateStr+"T12:00:00").getDay()]; }
function fmtDate(dateStr){
  if(!dateStr) return "بدون موعد";
  const d = new Date(dateStr+"T12:00:00");
  return dayName(dateStr)+" "+d.toLocaleDateString("ar-JO",{day:"numeric",month:"long"});
}
function taskStatus(t){
  if(t.done) return "done";
  if(!t.due) return "up";
  if(t.due < todayStr()) return "late";
  if(t.due === todayStr()) return "today";
  return "up";
}
const STATUS_LABEL = {late:"متأخرة", today:"اليوم", up:"قادمة", done:"منجزة"};
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function allTasks(){
  const out = [];
  meetings.forEach(m => m.tasks.forEach(t => out.push({...t, meetingId:m.id, meetingTitle:m.title})));
  return out;
}

/* ============================================================
   ٤) التنقل
   ============================================================ */
function go(v, meetingId){
  if(recording) stopRec();
  view = v; openMeetingId = meetingId ?? null; previewTasks = null;
  document.getElementById("nav-dash").classList.toggle("active", v==="dash");
  document.getElementById("nav-meet").classList.toggle("active", v!=="dash");
  render();
  window.scrollTo(0,0);
}

/* ============================================================
   ٥) لوحة اليوم
   ============================================================ */
function renderDash(){
  const tasks = allTasks();
  const groups = {late:[], today:[], up:[], done:[]};
  tasks.forEach(t => groups[taskStatus(t)].push(t));
  groups.late.sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  groups.up.sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));

  const open = tasks.filter(t=>!t.done).length;
  let summary;
  if(tasks.length===0) summary = "ما في مهام لسا — بلش بإضافة أول اجتماع";
  else if(open===0) summary = "كل المهام منجزة، يعطيك العافية! ✨";
  else summary = `عندك ${open} مهمة مفتوحة` + (groups.late.length? ` — منها ${groups.late.length} متأخرة ⚠️` : "");

  let html = `<div class="hero"><div class="date">${fmtDate(todayStr())}</div><h1>أهلاً ${esc((me?.full_name||"").split(" ")[0]||"")} 👋</h1><div class="summary">${summary}</div></div>`;

  if(tasks.length===0){
    html += `<div class="card"><div class="empty"><div class="big">🗂️</div>لوحة اليوم بتجمعلك كل المهام من كل الاجتماعات بمكان واحد.<br><button class="btn" style="margin-top:14px" onclick="go('meet')">أضف أول اجتماع</button></div></div>`;
  }else{
    html += `<div class="card">`;
    [["late","🔴"],["today","🟡"],["up","🟢"],["done","✅"]].forEach(([key,icon])=>{
      if(groups[key].length===0) return;
      html += `<div class="group-title">${icon} ${STATUS_LABEL[key]} <span class="count">${groups[key].length}</span></div>`;
      groups[key].forEach(t => html += taskRow(t, true));
    });
    html += `</div>`;
  }
  return html;
}

function taskRow(t, showMeeting){
  const st = taskStatus(t);
  const canToggle = t.ownerId===me?.id || meetings.find(m=>m.id===(t.meetingId||openMeetingId))?._mine !== false;
  return `
  <div class="task ${t.done?"done":""}">
    <input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}', this.checked)">
    <div class="body">
      <div class="title">${esc(t.desc)}</div>
      <div class="meta">
        <span class="badge type">${esc(t.type)}</span>
        <span>👤 ${esc(t.owner)}</span>
        <span class="badge ${st}">📅 ${fmtDate(t.due)}</span>
        ${showMeeting? `<span>· ${esc(t.meetingTitle)}</span>`:""}
      </div>
      ${t.notes? `<div class="notes">📝 ${esc(t.notes)}</div>`:""}
    </div>
    <button class="btn danger small" onclick="deleteTask(this,'${t.id}')">حذف</button>
  </div>`;
}

/* ============================================================
   ٦) الاجتماعات: قائمة + إنشاء
   ============================================================ */
function renderMeetings(){
  let html = `
  <div class="card">
    <h2>اجتماع جديد</h2>
    <div class="sub">نفس تيمبلت محضر الاجتماع تبعكم</div>
    <div class="grid c3">
      <div><label>العنوان</label><input id="m-title" placeholder="مثلاً: اجتماع متابعة المشروع"></div>
      <div><label>الموقع</label><input id="m-loc" placeholder="مثلاً: المكتب الرئيسي"></div>
      <div><label>التاريخ</label><input id="m-date" type="date" value="${todayStr()}"></div>
    </div>
    <label>الحضور — اكبس على الاسم لإضافته أو شيله</label>
    <div class="chips" id="m-att">
      ${teamProfiles.map(p=>`<span class="chip" data-name="${esc(p.full_name)}" onclick="this.classList.toggle('off')">${esc(p.full_name)}</span>`).join("")}
      <span class="chip add" onclick="showEl('newp-box')">+ اسم جديد</span>
    </div>
    <div id="newp-box" style="display:none;margin-top:10px" class="grid c2">
      <div><input id="newp-input" placeholder="اسم حاضر خارجي (بدون حساب)" onkeydown="if(event.key==='Enter')addExtraAttendee()"></div>
      <div><button class="btn small" onclick="addExtraAttendee()">إضافة</button></div>
    </div>
    <div class="grid c2" style="margin-top:12px">
      <div><label>اعداد</label><input id="m-prep" placeholder="مين كتب المحضر" value="${esc(me?.full_name||"")}"></div>
    </div>
    <button class="btn" id="create-meeting-btn" onclick="addMeeting()">إنشاء الاجتماع</button>
  </div>`;

  html += `<div class="card"><h2>اجتماعاتك</h2><div class="sub">اكبس على أي اجتماع لفتحه وإضافة المهام</div>`;
  if(meetings.length===0){
    html += `<div class="empty"><div class="big">🗓️</div>ما في اجتماعات لسا</div>`;
  }else{
    meetings.forEach(m=>{
      const open = m.tasks.filter(t=>!t.done).length;
      html += `
      <div class="meeting-row" onclick="go('detail','${m.id}')">
        <div class="info">
          <div class="title">${esc(m.title)}</div>
          <div class="details">📍 ${esc(m.location||"—")} · ${fmtDate(m.date)} · 👥 ${m.attendees.length} حضور</div>
        </div>
        <div class="m-stat"><b>${m.tasks.length}</b>مهام</div>
        <div class="m-stat"><b style="color:${open? 'var(--danger)':'var(--ok)'}">${open}</b>مفتوحة</div>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

/* أسماء إضافية (حضور بدون حساب بالنظام) بتتخزن جوا نفس شاشة الإنشاء بس */
let extraAttendees = [];
function addExtraAttendee(){
  const el = document.getElementById("newp-input");
  const n = el.value.trim();
  if(!n) return;
  extraAttendees.push(n);
  const box = document.getElementById("m-att");
  box.insertAdjacentHTML("beforeend", `<span class="chip" data-name="${esc(n)}" onclick="this.classList.toggle('off')">${esc(n)}</span>`);
  el.value = "";
}
function showEl(id){ const el = document.getElementById(id); el.style.display = "grid"; el.querySelector("input")?.focus(); }
function flagInput(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.borderColor = "var(--danger)"; el.focus();
  setTimeout(()=>{ el.style.borderColor = ""; }, 1600);
}

async function addMeeting(){
  const title = document.getElementById("m-title").value.trim();
  if(!title){ flagInput("m-title"); return; }
  const btn = document.getElementById("create-meeting-btn");
  btn.disabled = true; btn.textContent = "عم أنشئ...";

  const attendees = [...document.querySelectorAll("#m-att .chip:not(.off):not(.add)")].map(c=>c.dataset.name);

  const { data: meeting, error } = await sb.from("meetings").insert({
    title,
    location: document.getElementById("m-loc").value.trim(),
    meeting_date: document.getElementById("m-date").value || todayStr(),
    prepared_by: document.getElementById("m-prep").value.trim(),
    created_by: me.id
  }).select().single();

  if(error){ alert("صار خطأ: " + error.message); btn.disabled=false; btn.textContent="إنشاء الاجتماع"; return; }

  if(attendees.length){
    await sb.from("meeting_attendees").insert(attendees.map(a => ({ meeting_id: meeting.id, attendee_name: a })));
  }

  extraAttendees = [];
  await loadMeetings();
  go("detail", meeting.id);
}

    <div class="sub">📍 ${esc(m.location||"—")} · ${fmtDate(m.date)} · ✍️ اعداد: ${esc(m.preparedBy||"—")}</div>
    <div class="chips">
      ${m.attendees.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}

    </div>
    <div id="att-box" style="display:none;margin-top:10px" class="grid c2">

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn rec" id="rec-btn" onclick="toggleRec()">🎙️ سجّل الاجتماع</button>
      <span class="rec-status" id="rec-status"></span>
    </div>
    <textarea id="smart-text" placeholder="مثلاً:&#10;سلام يجهز عرض الأسعار ويبعثه قبل الخميس&#10;متابعة موضوع العقد مع المحامي - عبدالله"></textarea>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button class="btn gold" id="smart-btn" onclick="smartParse()">✨ فصّلها مهام</button>

  <div class="card">
    <h2>مهمة يدوية</h2>
    <div class="grid c2">

      <div><label>المسؤول</label><select id="t-owner">${teamProfiles.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join("")}</select></div>

async function addAttendee(meetingId){
  const el = document.getElementById("att-input");
  const n = el.value.trim();
  if(!n) return;
  await sb.from("meeting_attendees").insert({ meeting_id: meetingId, attendee_name: n });
  await loadMeetings();
  render();
}

/* ---------- ✨ الإدخال الذكي: يستدعي كلود لتحليل النص ---------- */
async function smartParse(){
  const text = document.getElementById("smart-text").value.trim();
  if(!text){ flagInput("smart-text"); return; }
  const btn = document.getElementById("smart-btn");
  const out = document.getElementById("smart-out");
  btn.disabled = true;
  out.innerHTML = `<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> عم أفصّل النقاط لمهام...</div>`;

  const names = teamProfiles.map(p=>p.full_name).join("، ");
  const prompt = `أنت مساعد داخل تطبيق إدارة اجتماعات. المستخدم أعطاك نصاً بالعربي (لهجة أردنية أحياناً): إما نقاط مكتوبة، أو تفريغ صوتي كامل لاجتماع فيه نقاش وكلام جانبي. مهمتك تستخرج منه نقاط العمل (action points) فقط وتحولها لمهام منفصلة، وتتجاهل السلام والنقاش الجانبي.

معلومات تساعدك:
- تاريخ اليوم: ${todayStr()} وهو يوم ${dayName(todayStr())}
- أسماء الفريق: ${names}
- أنواع المهام المسموحة: "متابعة" أو "تنفيذ" فقط

قواعد:
1. كل نقطة عمل مستقلة = مهمة منفصلة
2. حدد المسؤول من أسماء الفريق إذا مذكور اسمه أو جزء منه. إذا مش واضح خليها أول اسم بالقائمة
3. حوّل أي موعد نسبي (الخميس، بكرا...) لتاريخ فعلي YYYY-MM-DD بناءً على تاريخ اليوم. إذا ما في موعد خليه null
4. النوع: متابعة موضوع/تذكير = "متابعة"، شغل ينعمل = "تنفيذ"

أرجع JSON فقط بدون أي كلام إضافي وبدون markdown:
[{"type":"تنفيذ","desc":"...","owner":"الاسم الكامل من القائمة","due":"2026-08-06","notes":""}]

ملاحظات الاجتماع:
"""${text}"""`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] })
    });
    const data = await response.json();
    const raw = (data.content||[]).map(i=>i.text||"").join("");
    const clean = raw.replace(/```json|```/g,"").trim();
    previewTasks = JSON.parse(clean);
    if(!Array.isArray(previewTasks) || previewTasks.length===0) throw new Error("empty");
    renderPreview();
  }catch(err){
    out.innerHTML = `<div class="sub" style="color:var(--danger);margin-top:10px">صار خطأ بالتحليل — جرب مرة ثانية أو قسّم النقاط أوضح. (هاي الميزة بتحتاج إعداد إضافي على الموقع المرفوع)</div>`;
  }
  btn.disabled = false;
}

function findProfileByName(name){
  return teamProfiles.find(p=>p.full_name===name) || teamProfiles[0];
}

function renderPreview(){
  const out = document.getElementById("smart-out");
  let html = `<div class="sub" style="margin:14px 0 8px">✅ فصّلتلك <b>${previewTasks.length}</b> مهام — راجعها وعدّل اللي بدك ياه ثم أكّد:</div>`;
  previewTasks.forEach((t,i)=>{
    const owner = findProfileByName(t.owner);
    html += `
    <div class="preview-item">
      <div class="grid c2">
        <div><label>المهمة</label><input value="${esc(t.desc)}" onchange="previewTasks[${i}].desc=this.value"></div>
        <div><label>المسؤول</label>
          <select onchange="previewTasks[${i}].owner=this.value">
            ${teamProfiles.map(p=>`<option ${p.full_name===owner?.full_name?"selected":""}>${esc(p.full_name)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grid c3">
        <div><label>النوع</label><select onchange="previewTasks[${i}].type=this.value">${TASK_TYPES.map(x=>`<option ${x===t.type?"selected":""}>${x}</option>`).join("")}</select></div>
        <div><label>تاريخ التسليم</label><input type="date" value="${t.due||""}" onchange="previewTasks[${i}].due=this.value"></div>
        <div><label>ملاحظات</label><input value="${esc(t.notes||"")}" onchange="previewTasks[${i}].notes=this.value"></div>
      </div>
      <button class="btn danger small" onclick="previewTasks.splice(${i},1);renderPreview()">شيل هاي</button>
    </div>`;
  });
  html += `<button class="btn" id="confirm-preview-btn" onclick="confirmPreview()">✔️ أضف الكل (${previewTasks.length})</button>`;
  out.innerHTML = html;
}

async function confirmPreview(){
  const btn = document.getElementById("confirm-preview-btn");
  btn.disabled = true; btn.textContent = "عم أضيف...";
  const rows = previewTasks.map(t=>{
    const owner = findProfileByName(t.owner);
    return {
      meeting_id: openMeetingId,
      task_type: TASK_TYPES.includes(t.type)? t.type : "تنفيذ",
      description: t.desc || "مهمة",
      owner_id: owner?.id || null,
      owner_name: owner?.full_name || t.owner || "",
      due_date: t.due || null,
      notes: t.notes || "",
      is_done: false
    };
  });
  const { error } = await sb.from("tasks").insert(rows);
  if(error){ alert("صار خطأ: " + error.message); }
  previewTasks = null;
  await loadMeetings();
  render();
}

/* ---------- المهمة اليدوية ---------- */
async function addTask(){
  const desc = document.getElementById("t-desc").value.trim();
  if(!desc){ flagInput("t-desc"); return; }
  const btn = document.getElementById("add-task-btn");
  btn.disabled = true; btn.textContent = "عم أضيف...";

  const ownerSel = document.getElementById("t-owner");
  const ownerId = ownerSel.value;
  const ownerName = ownerSel.options[ownerSel.selectedIndex].textContent;

  const { error } = await sb.from("tasks").insert({
    meeting_id: openMeetingId,
    task_type: document.getElementById("t-type").value,
    description: desc,
    owner_id: ownerId,
    owner_name: ownerName,
    due_date: document.getElementById("t-due").value || null,
    notes: document.getElementById("t-notes").value.trim(),
    is_done: false
  });
  if(error){ alert("صار خطأ: " + error.message); }
  await loadMeetings();
  render();
}

async function toggleTask(taskId, isDone){
  const { error } = await sb.from("tasks").update({ is_done: isDone }).eq("id", taskId);
  if(error){ alert("صار خطأ: " + error.message); }
  await loadMeetings();
  render();
}
async function deleteTask(btn, taskId){
  if(btn.dataset.armed !== "1"){
    btn.dataset.armed = "1"; btn.textContent = "متأكد؟";
    setTimeout(()=>{ btn.dataset.armed = "0"; btn.textContent = "حذف"; }, 2500);
    return;
  }
  await sb.from("tasks").delete().eq("id", taskId);
  await loadMeetings();
  render();
}

/* ---------- 🎙️ التسجيل الصوتي ---------- */
let recognition = null, recording = false, recFinal = "";
function toggleRec(){
  const btn = document.getElementById("rec-btn"), status = document.getElementById("rec-status");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ status.textContent = "⚠️ متصفحك ما بيدعم التحويل الصوتي — جرب كروم"; return; }
  if(recording){ stopRec(); return; }
  recognition = new SR();
  recognition.lang = "ar-JO"; recognition.continuous = true; recognition.interimResults = true;
  recFinal = document.getElementById("smart-text").value;
  if(recFinal && !recFinal.endsWith("\n")) recFinal += "\n";
  recognition.onresult = (event)=>{
    let interim = "";
    for(let i = event.resultIndex; i < event.results.length; i++){
      const r = event.results[i];
      if(r.isFinal) recFinal += r[0].transcript.trim() + "\n"; else interim += r[0].transcript;
    }
    const box = document.getElementById("smart-text");
    box.value = recFinal + interim; box.scrollTop = box.scrollHeight;
  };
  recognition.onend = ()=>{ if(recording){ try{ recognition.start(); }catch(e){} } };
  recognition.onerror = (e)=>{
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      stopRec(); status.textContent = "⚠️ ما قدرت أوصل للمايكروفون";
    }
  };
  try{
    recognition.start(); recording = true;
    btn.textContent = "⏹️ وقّف التسجيل"; btn.classList.add("on");
    status.textContent = "🔴 عم أسجل... احكوا طبيعي"; status.classList.add("live");
  }catch(e){ status.textContent = "⚠️ ما قدرت أشغل التسجيل بهاي البيئة"; }
}
function stopRec(){
  recording = false;
  try{ recognition?.stop(); }catch(e){}
  const btn = document.getElementById("rec-btn"), status = document.getElementById("rec-status");
  if(btn){ btn.textContent = "🎙️ سجّل الاجتماع"; btn.classList.remove("on"); }
  if(status){ status.textContent = "✔️ وقف التسجيل — راجع النص ثم اكبس فصّلها مهام"; status.classList.remove("live"); }
}

  const app = document.getElementById("app");
  if(view==="dash") app.innerHTML = renderDash();
  else if(view==="meet") app.innerHTML = renderMeetings();
